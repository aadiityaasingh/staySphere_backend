name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Jest API Test Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Tests
        env:
          NODE_ENV: test
          PORT: 8080
          ATLASDB_URL: mongodb://localhost:27017/staysphere_ci_test
          SECRET: ci_test_session_secret_for_automated_testing
        run: npm test
